<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>MathCore — Превью иконок</title>
<style>
  body { background: #1a1a2e; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 40px; gap: 40px; }
  h1 { color: #fff; margin: 0; font-size: 22px; letter-spacing: 1px; }
  .row { display: flex; gap: 48px; flex-wrap: wrap; justify-content: center; }
  .card { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .label { color: #94a3b8; font-size: 13px; text-align: center; max-width: 160px; line-height: 1.5; }
  .label strong { color: #e2e8f0; display: block; font-size: 15px; margin-bottom: 4px; }
  .icon-wrap { border-radius: 22px; overflow: hidden; box-shadow: 0 8px 32px rgba(0,0,0,0.6); }
  /* Размер как на телефоне — 108x108 */
  svg { display: block; }
</style>
</head>
<body>

<h1>🎨 MathCore — Варианты иконки</h1>

<div class="row">

  <!-- ═══════════════════════════════════════════════
       КОНЦЕПЦИЯ 1: Знак интеграла
  ════════════════════════════════════════════════ -->
  <div class="card">
    <div class="icon-wrap">
      <svg width="108" height="108" viewBox="0 0 108 108">
        <defs>
          <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3B0764"/>
            <stop offset="100%" stop-color="#7C3AED"/>
          </linearGradient>
        </defs>
        <!-- Фон -->
        <rect width="108" height="108" fill="url(#bg1)"/>
        <!-- Свечение -->
        <circle cx="54" cy="54" r="30" fill="white" opacity="0.1"/>
        <!-- Знак интеграла ∫ — через текст (100% правильный) -->
        <text x="54" y="82" text-anchor="middle"
              font-family="Georgia, 'Times New Roman', serif"
              font-size="78" fill="white" opacity="0.95">∫</text>
        <!-- Золотая точка -->
        <circle cx="73" cy="30" r="6" fill="#FBBF24"/>
      </svg>
    </div>
    <div class="label">
      <strong>1 — Минимализм</strong>
      Знак интеграла ∫<br>Строгий · Академичный
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════
       КОНЦЕПЦИЯ 2: Треугольник Пенроуза
  ════════════════════════════════════════════════ -->
  <div class="card">
    <div class="icon-wrap">
      <svg width="108" height="108" viewBox="0 0 108 108">
        <defs>
          <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#060B18"/>
            <stop offset="100%" stop-color="#0F2044"/>
          </linearGradient>
        </defs>
        <!-- Фон -->
        <rect width="108" height="108" fill="url(#bg2)"/>
        <!-- Правая грань (средне-синяя) -->
        <polygon points="54,18 64,25 91,82 81,89" fill="#2563EB"/>
        <!-- Нижняя грань (тёмно-синяя) -->
        <polygon points="25,89 83,89 83,97 25,97" fill="#1E40AF"/>
        <!-- Левая грань (голубая) -->
        <polygon points="54,18 44,25 17,82 27,89" fill="#60A5FA"/>
        <!-- Колпачок вершины — правая поверх левой (невозможный эффект) -->
        <polygon points="54,18 64,25 57,30 48,25" fill="#2563EB"/>
        <!-- Блик на левой грани -->
        <polygon points="54,18 49,22 23,78 27,89 44,25" fill="#93C5FD" opacity="0.35"/>
      </svg>
    </div>
    <div class="label">
      <strong>2 — Геометрия</strong>
      Треугольник Пенроуза<br>Интеллектуальный · Абстрактный
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════
       КОНЦЕПЦИЯ 3: Золотой щит + Σ
  ════════════════════════════════════════════════ -->
  <div class="card">
    <div class="icon-wrap">
      <svg width="108" height="108" viewBox="0 0 108 108">
        <defs>
          <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0C1A3A"/>
            <stop offset="100%" stop-color="#1E3A8A"/>
          </linearGradient>
        </defs>
        <!-- Фон -->
        <rect width="108" height="108" fill="url(#bg3)"/>
        <!-- Щит (золотой) -->
        <path d="M 24,22 L 84,22 L 84,64 C 84,76 70,87 54,93 C 38,87 24,76 24,64 Z" fill="#F59E0B"/>
        <!-- Внутренняя тень щита -->
        <path d="M 30,28 L 78,28 L 78,63 C 78,73 66,82 54,87 C 42,82 30,73 30,63 Z" fill="#92400E" opacity="0.45"/>
        <!-- Блик (металлический) -->
        <path d="M 30,28 L 60,28 L 54,40 L 30,40 Z" fill="#FDE68A" opacity="0.5"/>
        <!-- Символ Σ — через текст (100% правильный) -->
        <text x="54" y="76" text-anchor="middle"
              font-family="Georgia, 'Times New Roman', serif"
              font-size="50" font-weight="bold" fill="white">Σ</text>
        <!-- Звезда над щитом -->
        <polygon points="54,10 56.4,17.3 64,17.3 57.8,21.7 60.2,29 54,24.6 47.8,29 50.2,21.7 44,17.3 51.6,17.3"
                 fill="#FCD34D"/>
      </svg>
    </div>
    <div class="label">
      <strong>3 — Игровой вызов</strong>
      Золотой щит + Σ<br>Геймификация · Победа
    </div>
  </div>

</div>

<p style="color:#475569; font-size:12px; margin-top: 20px;">
  Размер соответствует реальной иконке на телефоне (108×108dp)
</p>

</body>
</html>
