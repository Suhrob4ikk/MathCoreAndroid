<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Фон -->
  <rect width="512" height="512" rx="128" fill="#121212"/>
  
  <!-- Орбитальные кольца -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#00E5FF" stroke-width="6" opacity="0.6"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#D500F9" stroke-width="5" opacity="0.5" transform="rotate(30 256 256)"/>
  
  <!-- Шестиугольное ядро -->
  <polygon points="256,100 390,178 390,334 256,412 122,334 122,178" 
           fill="none" stroke="#00B0FF" stroke-width="10" rx="20"/>
  
  <!-- Интеграл внутри ядра -->
  <text x="256" y="310" font-family="serif" font-size="140" font-weight="bold" 
        fill="#FFFFFF" text-anchor="middle" filter="url(#glow)">∫</text>
  
  <!-- Символы на орбитах -->
  <!-- Σ слева -->
  <text x="95" y="270" font-family="serif" font-size="60" font-weight="bold" 
        fill="#FFFFFF" text-anchor="middle">Σ</text>
  <!-- ∂ справа-сверху -->
  <text x="400" y="150" font-family="serif" font-size="60" font-weight="bold" 
        fill="#FFFFFF" text-anchor="middle">∂</text>
  <!-- lim справа-снизу -->
  <text x="405" y="390" font-family="sans-serif" font-size="50" font-weight="bold" 
        fill="#FFFFFF" text-anchor="middle">lim</text>
  
  <!-- Лёгкое свечение для интеграла -->
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feMerge>
        <feMergeNode in="offsetBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>